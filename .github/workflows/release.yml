name: Compile Release

# Build and attach the EchoPoint firmware after a release or pre-release is
# published. The tag supplies the source revision and the asset version; OTA
# looks for echopoint-<tag>-metalio_eink4.bin, so the tag has no "v" prefix.

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  PIO_ENV: metalio_eink4-audiobook-gh_release
  DEVICE: metalio_eink4

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          configured_version="$(sed -n 's/^version = //p' platformio.ini | head -n1)"
          if [ "$RELEASE_TAG" != "$configured_version" ]; then
            echo "::error::Tag '$RELEASE_TAG' must equal the platformio.ini version '$configured_version'."
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig run a nested `pio run` from
          # ~/.platformio/penv. Keep that core on the same version as the outer core.
          # See https://github.com/pioarduino/platform-espressif32/issues/529
          pio pkg install -e "$PIO_ENV"
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Build EchoPoint
        env:
          # Optional LCP enrollment key; without the secret the build only
          # loses LCP.
          FREEINK_LCP_RELEASE_KEY: ${{ secrets.FREEINK_LCP_RELEASE_KEY }}
        run: |
          if [ -n "$FREEINK_LCP_RELEASE_KEY" ]; then
            export PLATFORMIO_BUILD_FLAGS="-DFREEINK_LCP_RELEASE_KEY=\\\"$FREEINK_LCP_RELEASE_KEY\\\""
          fi
          pio run -e "$PIO_ENV" -j1

      - name: Prepare firmware asset
        id: asset
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="echopoint-${RELEASE_TAG}-${DEVICE}.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "$asset"
          echo "name=$asset" >> "$GITHUB_OUTPUT"

      - name: Prepare license asset
        run: python3 scripts/build_release_license.py --env "$PIO_ENV" --output dist/LICENSE

      - name: Stage license asset
        uses: actions/upload-artifact@v6
        with:
          name: release-license
          path: dist/LICENSE
          if-no-files-found: error
          retention-days: 1

      - name: Stage firmware asset
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.asset.outputs.name }}
          path: ${{ steps.asset.outputs.name }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware asset
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: echopoint-*.bin
          merge-multiple: true

      - name: Download license asset
        uses: actions/download-artifact@v4
        with:
          name: release-license
          path: dist

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          asset="dist/echopoint-${RELEASE_TAG}-${DEVICE}.bin"
          # Exactly one firmware image and the license file.
          test -s "$asset"
          test -s dist/LICENSE
          test "$(find dist -type f | wc -l)" -eq 2
          gh release upload "$RELEASE_TAG" "$asset" dist/LICENSE \
            --repo "$GITHUB_REPOSITORY" --clobber
