<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-labelledby="t">
  <title id="t">EchoPoint: read and listen on the Metalio E-Ink 4</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2a44"/>
      <stop offset="1" stop-color="#2d3f66"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect x="0" y="0" width="1000" height="220" rx="18" fill="url(#bg)"/>

  <!-- open book -->
  <g transform="translate(70,52)" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M70,24 C50,10 22,8 4,14 V104 C22,98 50,100 70,114 Z" fill="#f4f1ea" stroke="#f4f1ea" stroke-width="3"/>
    <path d="M70,24 C90,10 118,8 136,14 V104 C118,98 90,100 70,114 Z" fill="#e6e1d6" stroke="#e6e1d6" stroke-width="3"/>
    <path d="M70,24 V114" stroke="#1f2a44" stroke-width="2.5"/>
    <g stroke="#9aa6bf" stroke-width="3">
      <path d="M18,36 C32,33 46,34 58,40"/>
      <path d="M18,52 C32,49 46,50 58,56"/>
      <path d="M18,68 C32,65 46,66 58,72"/>
      <path d="M82,40 C94,34 108,33 122,36"/>
      <path d="M82,56 C94,50 108,49 122,52"/>
    </g>
    <!-- sound waves -->
    <g stroke="#f2b84b" stroke-width="5">
      <path d="M154,46 C166,58 166,80 154,92"/>
      <path d="M170,32 C190,52 190,86 170,106"/>
      <path d="M186,18 C214,46 214,92 186,120"/>
    </g>
  </g>

  <text x="330" y="112" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="1">EchoPoint</text>
  <text x="333" y="152" font-size="22" fill="#c9d3e8">Read and listen on the Metalio E-Ink 4</text>
  <text x="333" y="182" font-size="15" fill="#8f9bb8">A CrossPoint Reader fork with an audiobook player, speaker and Bluetooth headphones</text>
</svg>
