<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">
<defs>
<pattern id="lightgray" width="2" height="2" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="#fff"/><rect width="1" height="1" fill="#000"/></pattern>
</defs>
<rect width="480" height="800" fill="#fff"/>
<!-- Reader page underneath (EpubReaderActivity), mostly covered by the sheet -->
<text y="37" font-size="29.17"><tspan x="5.0">dancing</tspan><tspan x="127.9">with</tspan><tspan x="200.0">the</tspan><tspan x="258.2">only</tspan><tspan x="329.4">handsome</tspan></text>
<text y="72" font-size="29.17"><tspan x="5.0">girl</tspan><tspan x="63.4">in</tspan><tspan x="102.3">the</tspan><tspan x="160.6">room,”</tspan><tspan x="266.3">said</tspan><tspan x="335.4">Mr.</tspan><tspan x="390.4">Darcy,</tspan></text>
<text y="107" font-size="29.17"><tspan x="5.0">looking</tspan><tspan x="114.4">at</tspan><tspan x="148.9">the</tspan><tspan x="201.4">eldest</tspan><tspan x="291.8">Miss</tspan><tspan x="361.3">Bennet.</tspan></text>
<text y="159" font-size="29.17"><tspan x="21.0">“Oh!</tspan><tspan x="97.7">she</tspan><tspan x="163.8">is</tspan><tspan x="203.0">the</tspan><tspan x="265.6">most</tspan><tspan x="352.6">beautiful</tspan></text>
<text y="194" font-size="29.17"><tspan x="5.0">creature</tspan><tspan x="132.5">I</tspan><tspan x="155.1">ever</tspan><tspan x="227.0">beheld!</tspan><tspan x="341.9">But</tspan><tspan x="402.1">there</tspan></text>
<text y="229" font-size="29.17"><tspan x="5.0">is</tspan><tspan x="38.5">one</tspan><tspan x="102.5">of</tspan><tspan x="142.2">her</tspan><tspan x="200.7">sisters</tspan><tspan x="301.1">sitting</tspan><tspan x="399.1">down</tspan></text>
<text y="264" font-size="29.17"><tspan x="5.0">just</tspan><tspan x="80.5">behind</tspan><tspan x="201.9">you,</tspan><tspan x="285.8">who</tspan><tspan x="369.8">is</tspan><tspan x="416.8">very</tspan></text>
<text y="299" font-size="29.17"><tspan x="5.0">pretty,</tspan><tspan x="124.2">and</tspan><tspan x="207.3">I</tspan><tspan x="247.9">dare</tspan><tspan x="340.9">say</tspan><tspan x="416.8">very</tspan></text>
<text y="334" font-size="29.17"><tspan x="5.0">agreeable.</tspan><tspan x="173.7">Do</tspan><tspan x="236.7">let</tspan><tspan x="295.2">me</tspan><tspan x="362.9">ask</tspan><tspan x="432.9">my</tspan></text>
<text y="369" font-size="29.17"><tspan x="5.0">partner</tspan><tspan x="116.0">to</tspan><tspan x="151.7">introduce</tspan><tspan x="290.8">you.”</tspan></text>
<text y="421" font-size="29.17"><tspan x="21.0">“Which</tspan><tspan x="146.4">do</tspan><tspan x="211.6">you</tspan><tspan x="291.8">mean?”</tspan><tspan x="422.7">and</tspan></text>
<text y="456" font-size="29.17"><tspan x="5.0">turning</tspan><tspan x="127.4">round</tspan><tspan x="230.8">he</tspan><tspan x="285.6">looked</tspan><tspan x="398.6">for</tspan><tspan x="458.6">a</tspan></text>
<text y="491" font-size="29.17"><tspan x="5.0">moment</tspan><tspan x="133.3">at</tspan><tspan x="171.3">Elizabeth,</tspan><tspan x="314.4">till</tspan><tspan x="358.6">catching</tspan></text>
<text y="526" font-size="29.17"><tspan x="5.0">her</tspan><tspan x="61.0">eye,</tspan><tspan x="125.5">he</tspan><tspan x="169.5">withdrew</tspan><tspan x="306.2">his</tspan><tspan x="355.2">own</tspan><tspan x="422.7">and</tspan></text>
<text y="561" font-size="29.17"><tspan x="5.0">coldly</tspan><tspan x="98.2">said:</tspan><tspan x="175.4">“She</tspan><tspan x="250.0">is</tspan><tspan x="285.2">tolerable,</tspan><tspan x="428.5">but</tspan></text>
<text y="596" font-size="29.17"><tspan x="5.0">not</tspan><tspan x="66.5">handsome</tspan><tspan x="227.4">enough</tspan><tspan x="348.8">to</tspan><tspan x="392.3">tempt</tspan></text>
<text y="631" font-size="29.17"><tspan x="5.0">me;</tspan><tspan x="65.2">I</tspan><tspan x="83.9">am</tspan><tspan x="136.2">in</tspan><tspan x="170.5">no</tspan><tspan x="214.9">humour</tspan><tspan x="334.6">at</tspan><tspan x="370.2">present</tspan></text>
<text y="666" font-size="29.17"><tspan x="5.0">to</tspan><tspan x="55.6">give</tspan><tspan x="134.7">consequence</tspan><tspan x="338.0">to</tspan><tspan x="388.5">young</tspan></text>
<text y="701" font-size="29.17"><tspan x="5.0">ladies</tspan><tspan x="98.9">who</tspan><tspan x="171.6">are</tspan><tspan x="230.0">slighted</tspan><tspan x="354.0">by</tspan><tspan x="400.3">other</tspan></text>
<text y="736" font-size="29.17"><tspan x="5.0">men.</tspan><tspan x="94.3">You</tspan><tspan x="164.8">had</tspan><tspan x="236.9">better</tspan><tspan x="340.5">return</tspan><tspan x="446.8">to</tspan></text>
<text y="771" font-size="29.17"><tspan x="5.0">your</tspan><tspan x="100.4">partner</tspan><tspan x="236.6">and</tspan><tspan x="321.8">enjoy</tspan><tspan x="428.5">her</tspan></text>
