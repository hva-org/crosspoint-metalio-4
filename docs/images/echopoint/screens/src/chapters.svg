<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800">
  <!-- Illustration of AudiobookChapterListActivity (Lyra theme, Metalio E-Ink 4, 480x800 portrait, touch).
       Geometry from: LyraMetrics (src/components/themes/lyra/LyraTheme.h), BaseTheme::drawHeader,
       freeink-sdk FreeInkUI header()/list(). Fonts: firmware uses Ubuntu 12pt/8pt at 150 DPI (25px / 16.7px). -->
  <rect width="480" height="800" fill="#ffffff"/>

  <!-- Header band {0,10,480,84}: back arrow (touch board), bold title, battery; 3px rule at the band bottom. -->
  <!-- Back button: Lucide arrow-left rasterised at 32px, centred in the 48px button at (4,40) -> icon at (12,48). -->
  <g transform="translate(12 48) scale(1.333333)" fill="none" stroke="#000000" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 19-7-7 7-7"/>
    <path d="M19 12H5"/>
  </g>
  <!-- Title tr(STR_AUDIOBOOK_CHAPTERS) = "Chapters", UI_12 bold, left-aligned at x=50, line top 47 -> baseline 71. -->
  <text x="50" y="71" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700"
        fill="#000000">Chapters</text>
  <!-- Battery: "80%" label (SMALL font, right-aligned 4px left of the glyph), 16x12 outline, 2x6 nub, 80% fill. -->
  <text x="436" y="26" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="16.67" text-anchor="end"
        fill="#000000">80%</text>
  <rect x="440.5" y="14.5" width="15" height="11" fill="none" stroke="#000000" stroke-width="1"/>
  <rect x="456" y="17" width="2" height="6" fill="#000000"/>
  <rect x="442" y="16" width="9" height="8" fill="#000000"/>
  <!-- Header underline: headerUnderlineSize 3, drawn inside the band's bottom edge. -->
  <rect x="0" y="91" width="480" height="3" fill="#000000"/>

  <!-- List band: y 110 (topPadding 10 + headerHeight 84 + verticalSpacing 16) to 800 (no button hints on touch).
       Rows inset 20px, 56px tall (touch minimum), 6px gap, label 8px inside the row. -->
  <!-- Selected row = current chapter (index 2): Lyra light pill, LightGray dither, radius 6. -->
  <rect x="20" y="234" width="440" height="56" rx="6" ry="6" fill="#d6d6d6"/>

  <g font-family="Noto Sans, DejaVu Sans, Arial, sans-serif" font-size="25" fill="#000000">
    <text x="28" y="147">Chapter 1</text>
    <text x="28" y="209">Chapter 2</text>
    <text x="28" y="271">Chapter 3</text>
    <text x="28" y="333">Chapter 4</text>
    <text x="28" y="395">Chapter 5</text>
    <text x="28" y="457">Chapter 6</text>
    <text x="28" y="519">Chapter 7</text>
    <text x="28" y="581">Chapter 8</text>
    <text x="28" y="643">Chapter 9</text>
    <text x="28" y="705">Chapter 10</text>
    <text x="28" y="767">Chapter 11</text>
  </g>

  <!-- Scroll indicator (61 chapters, 11 rows fit): 4px LightGray-dither track at the right edge, black thumb. -->
  <rect x="476" y="110" width="4" height="690" fill="#d6d6d6"/>
  <rect x="476" y="110" width="4" height="124" fill="#000000"/>
</svg>
