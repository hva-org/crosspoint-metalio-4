<svg xmlns="http://www.w3.org/2000/svg" width="480" height="800" viewBox="0 0 480 800" font-family="Noto Sans, DejaVu Sans, Arial, sans-serif">
  <!-- Illustration of AudiobookPlayerActivity (portrait, playing), Lyra theme, Metalio E-Ink 4.
       Geometry follows src/activities/audio/AudiobookPlayerActivity.cpp and src/components/AudioControls.cpp.
       Icons: Lucide (ISC license) and the filled Lucide variants in src/components/icons/audio/. -->
  <rect width="480" height="800" fill="#fff"/>

  <!-- ===== Header: GUI.drawHeader (BaseTheme.cpp:406) -> fui::header; band y=10..94, 3px rule ===== -->
  <!-- Back button, icon_header_back_32 (arrow-left), 48px box at (4,40) -->
  <g transform="translate(12 48) scale(1.3333)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m12 19-7-7 7-7"/>
    <path d="M19 12H5"/>
  </g>
  <!-- Title: book title, title font (UI 12 bold), left aligned after the back icon -->
  <text x="50" y="71" font-size="25" font-weight="bold" fill="#000">Pride and Prejudice</text>
  <!-- Battery: percent label (small font) + 16x12 glyph with nub, top-right strip -->
  <text x="436" y="26" font-size="16.7" text-anchor="end" fill="#000">82%</text>
  <rect x="440.5" y="14.5" width="15" height="11" fill="none" stroke="#000" stroke-width="1"/>
  <rect x="456" y="17" width="2" height="6" fill="#000"/>
  <rect x="442" y="16" width="9" height="8" fill="#000"/>
  <!-- Header underline (headerUnderlineSize = 3) -->
  <rect x="0" y="91" width="480" height="3" fill="#000"/>

  <!-- ===== Chapter title (body bold, centered) and "Chapter %u / %u" (small) ===== -->
  <text x="240" y="134" font-size="25" font-weight="bold" text-anchor="middle" fill="#000">Chapter 3</text>
  <text x="240" y="163" font-size="20.8" text-anchor="middle" fill="#000">Chapter 3 / 61</text>

  <!-- ===== Chapter slider (slimSlider): band y=438..486, 6px track, 16x28 knob; 12:41 of 31:05 ===== -->
  <rect x="20" y="459" width="440" height="6" fill="#c4c4c4"/>
  <rect x="20" y="459" width="179" height="6" fill="#000"/>
  <rect x="193.5" y="448.5" width="15" height="27" rx="3" fill="#000" stroke="#000" stroke-width="1"/>
  <!-- Time labels: STR_AUDIOBOOK_MINUTES / STR_AUDIOBOOK_MINUTES_LEFT -->
  <text x="20" y="508" font-size="20.8" fill="#000">12 min</text>
  <text x="460" y="508" font-size="20.8" text-anchor="end" fill="#000">-20 min</text>

  <!-- ===== Transport row (TALL_TRANSPORT 56/72/104, gap 18), centered on y=580 ===== -->
  <!-- Previous chapter: 56px outlined button, skip-back-filled 32 -->
  <rect x="25" y="553" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(36 564) scale(1.3333)" fill="#000" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/>
    <path d="M3 20V4"/>
  </g>
  <!-- Back 30 s: 72px outlined button, rotate-ccw 48 + bold "30" -->
  <rect x="99" y="545" width="70" height="70" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(110 556) scale(2)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
    <path d="M3 3v5h5"/>
  </g>
  <text x="134" y="587" font-size="20.8" font-weight="bold" text-anchor="middle" fill="#000">30</text>
  <!-- Play/pause disc: 104px, black while playing, white pause-filled 48 -->
  <circle cx="240" cy="580" r="52" fill="#000"/>
  <g transform="translate(216 556) scale(2)" fill="#fff" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="3" width="5" height="18" rx="1"/>
    <rect x="5" y="3" width="5" height="18" rx="1"/>
  </g>
  <!-- Forward 30 s: 72px outlined button, rotate-cw 48 + bold "30" -->
  <rect x="311" y="545" width="70" height="70" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(322 556) scale(2)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
    <path d="M21 3v5h-5"/>
  </g>
  <text x="346" y="587" font-size="20.8" font-weight="bold" text-anchor="middle" fill="#000">30</text>
  <!-- Next chapter: 56px outlined button, skip-forward-filled 32 -->
  <rect x="401" y="553" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(412 564) scale(1.3333)" fill="#000" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 4v16"/>
    <path d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/>
  </g>
  <!-- Status line (y=636..660) is empty while playing normally: not drawn -->

  <!-- ===== Extras row (56px): [-] 1x [+]   [chapters]   [output] ===== -->
  <rect x="21" y="677" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(36 692)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
  </g>
  <text x="116" y="713" font-size="25" font-weight="bold" text-anchor="middle" fill="#000">1x</text>
  <rect x="157" y="677" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(172 692)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14"/>
    <path d="M12 5v14"/>
  </g>
  <!-- Chapters: list 32 -->
  <rect x="281" y="677" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(292 688) scale(1.3333)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 5h.01"/>
    <path d="M3 12h.01"/>
    <path d="M3 19h.01"/>
    <path d="M8 5h13"/>
    <path d="M8 12h13"/>
    <path d="M8 19h13"/>
  </g>
  <!-- Output: headphones 32 (speaker icon when the output is the speaker) -->
  <rect x="405" y="677" width="54" height="54" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(416 688) scale(1.3333)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/>
  </g>

  <!-- ===== Volume row (44px): vol down, volume slider, vol up, 60% ===== -->
  <rect x="21" y="749" width="42" height="42" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(30 758)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
    <path d="M16 9a5 5 0 0 1 0 6"/>
  </g>
  <rect x="72" y="767" width="280" height="6" fill="#c4c4c4"/>
  <rect x="72" y="767" width="168" height="6" fill="#000"/>
  <rect x="230.5" y="756.5" width="15" height="27" rx="3" fill="#000" stroke="#000" stroke-width="1"/>
  <rect x="361" y="749" width="42" height="42" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <g transform="translate(370 758)" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/>
    <path d="M16 9a5 5 0 0 1 0 6"/>
    <path d="M19.364 18.364a9 9 0 0 0 0-12.728"/>
  </g>
  <text x="460" y="778" font-size="20.8" text-anchor="end" fill="#000">60%</text>
  <!-- No button hints: LyraTheme::drawButtonHints returns on touch boards -->
</svg>
